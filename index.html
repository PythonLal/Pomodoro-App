<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0e0b08">
    <meta name="description" content="A Pomodoro Timer App to help you focus and improve productivity.">
    <title>Pomodoro App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png?v=1">
</head>

<body>
    <div class="container" role="main">
        <div class="header">
            <h1>Pomodoro Timer</h1>
            <div class="header-controls">
                <button id="fullscreen-toggle" aria-label="Toggle fullscreen mode">⛶</button>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="standard">Standard Timer</button>
                <button class="tab-button" data-tab="custom">Custom Timer</button>
            </div>
        </div>

        <!-- Standard Timer Tab -->
        <div id="standard-tab" class="tab-content active">
                <div class="timer" aria-label="Timer">
                    <span id="minutes">00</span>:<span id="seconds">00</span>.<span id="milliseconds">000</span>
                </div>

            <div class="alarm-selection">
                <label for="alarm-type">Alarm Sound:</label>
                <select id="alarm-type">
                    <option value="low" selected>Low</option>
                    <option value="high">High</option>
                </select>
                <div class="volume-control">
                    <label for="alarm-volume">🔊</label>
                    <input type="range" id="alarm-volume" min="0" max="1" step="0.05" value="0.5" aria-label="Alarm volume">
                </div>
            </div>

            <div class="controls" role="toolbar" aria-label="Timer controls">
                <button id="start" aria-label="Start the timer">Start</button>
                <button id="pause" aria-label="Pause or resume the timer" disabled>Pause</button>
                <button id="stop" aria-label="Stop the timer" disabled>Stop</button>
            </div>

            <div class="kb-hint">Space · pause/resume &nbsp;·&nbsp; F · fullscreen</div>

            <div id="message" role="status" aria-live="polite"></div>
        </div>

        <!-- Custom Timer Tab -->
        <div id="custom-tab" class="tab-content">
            <div class="custom-timer-setup">
                <div class="time-inputs">
                    <div class="input-group">
                        <label for="custom-hours">Hours</label>
                        <input type="number" id="custom-hours" min="0" max="23" value="0">
                    </div>
                    <div class="input-group">
                        <label for="custom-minutes">Minutes</label>
                        <input type="number" id="custom-minutes" min="0" max="59" value="0">
                    </div>
                    <div class="input-group">
                        <label for="custom-seconds">Seconds</label>
                        <input type="number" id="custom-seconds" min="0" max="59" value="0">
                    </div>
                </div>
                <div class="preset-buttons">
                    <button class="preset-btn" data-time="300">5 min</button>
                    <button class="preset-btn" data-time="600">10 min</button>
                    <button class="preset-btn" data-time="1500">25 min</button>
                    <button class="preset-btn" data-time="3000">50 min</button>
                </div>
            </div>

            <div class="custom-timer-ring-wrapper">
                <svg class="progress-ring-svg" viewBox="0 0 260 260">
                    <circle class="progress-ring-track" cx="130" cy="130" r="120"/>
                    <circle class="progress-ring-fill" id="custom-ring-fill" cx="130" cy="130" r="120"
                        stroke-dasharray="753.98" stroke-dashoffset="753.98"/>
                </svg>
                <div class="custom-timer" aria-label="Custom Timer">
                    <span id="custom-timer-minutes">00</span>:<span id="custom-timer-seconds">00</span>
                </div>
            </div>

            <div class="custom-alarm-selection">
                <label for="custom-alarm-type">Alarm Sound:</label>
                <select id="custom-alarm-type">
                    <option value="low" selected>Low</option>
                    <option value="high">High</option>
                </select>
                <div class="volume-control">
                    <label for="custom-alarm-volume">🔊</label>
                    <input type="range" id="custom-alarm-volume" min="0" max="1" step="0.05" value="0.5" aria-label="Custom alarm volume">
                </div>
            </div>

            <div class="custom-controls" role="toolbar" aria-label="Custom timer controls">
                <button id="custom-start" aria-label="Start the custom timer">Start</button>
                <button id="custom-pause" aria-label="Pause or resume the custom timer" disabled>Pause</button>
                <button id="custom-reset" aria-label="Reset the custom timer">Reset</button>
            </div>

            <div id="custom-message" role="status" aria-live="polite"></div>
        </div>
    </div>

    <!-- Fullscreen overlay -->
    <div id="fullscreen-overlay" class="fullscreen-overlay hidden">
        <div class="fullscreen-content">
            <div class="fullscreen-timer">
                <span id="fs-minutes">00</span>:<span id="fs-seconds">00</span>
            </div>
            <div class="fullscreen-status" id="fs-status">Focus Time</div>
            <button id="exit-fullscreen" aria-label="Exit fullscreen">✕</button>
        </div>
    </div>

    <!-- Celebration Animation -->
    <div id="celebration" class="celebration hidden">
        <div class="confetti"></div>
        <div class="celebration-content">
            <div class="celebration-icon">🎉</div>
            <div class="celebration-text">Great Job!</div>
            <div class="celebration-subtext">Session Completed</div>
            <div class="celebration-dismiss">tap anywhere to continue</div>
        </div>
    </div>

    <!-- Rest Timer Modal -->
    <div id="rest-overlay" class="rest-overlay hidden">
        <div class="rest-modal">
            <div class="rest-header">
                <span class="rest-emoji">☕</span>
                <h2 class="rest-title">Break Time</h2>
                <p class="rest-subtitle" id="rest-subtitle">You earned it</p>
            </div>
            <div class="rest-ring-wrapper">
                <svg class="rest-ring-svg" viewBox="0 0 200 200">
                    <circle class="rest-ring-track" cx="100" cy="100" r="88"/>
                    <circle class="rest-ring-fill" id="rest-ring-fill" cx="100" cy="100" r="88"
                        stroke-dasharray="553.0" stroke-dashoffset="0"/>
                </svg>
                <div class="rest-countdown">
                    <span id="rest-minutes">00</span>:<span id="rest-seconds">00</span>
                </div>
            </div>
            <div class="rest-actions">
                <button id="rest-skip-btn" class="rest-skip-btn">Skip Break</button>
            </div>
        </div>
    </div>


    <audio id="alarm-sound-high" src="alarmhigh.mp3" preload="auto" hidden></audio>
    <script src="script.js"></script>
</body>

</html>
